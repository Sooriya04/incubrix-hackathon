<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IncuBrix Studio | Script-to-B-Roll Video Engine</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for inline JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              500: '#10b981',
              600: '#059669',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen antialiased selection:bg-emerald-500 selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      // shortcut: simple local session token auth, upgrade to OAuth2/JWT when multi-tenant user database is added
      const [auth, setAuth] = useState(() => {
        const saved = localStorage.getItem('incubrix_auth');
        return saved ? JSON.parse(saved) : null;
      });

      // Login form state
      const [email, setEmail] = useState('');
      const [authStep, setAuthStep] = useState('request'); // 'request' | 'verify'
      const [sentCode, setSentCode] = useState('');
      const [loginLink, setLoginLink] = useState('');
      const [inputCode, setInputCode] = useState('');
      const [authError, setAuthError] = useState('');
      const [authLoading, setAuthLoading] = useState(false);

      // Keys state
      const [keys, setKeys] = useState({ pixabay_configured: false, pixabay_masked: null, pexels_configured: false, pexels_masked: null });
      const [pixabayKeyInput, setPixabayKeyInput] = useState('');
      const [pexelsKeyInput, setPexelsKeyInput] = useState('');
      const [keyMessage, setKeyMessage] = useState('');
      const [keysLoading, setKeysLoading] = useState(false);

      // Video Job state
      const [scriptText, setScriptText] = useState('Building the future with agentic intelligence. Fast, scalable video creation for developers.');
      const [aspectRatio, setAspectRatio] = useState('16:9');
      const [styleTheme, setStyleTheme] = useState('developer');
      const [voice, setVoice] = useState('en-IN-female');
      const [avoidTags, setAvoidTags] = useState('watermark, low quality');

      const [activeJob, setActiveJob] = useState(null);
      const [generating, setGenerating] = useState(false);
      const [jobError, setJobError] = useState('');

      useEffect(() => {
        if (auth) {
          fetchKeys();
        }
      }, [auth]);

      // Polling active job
      useEffect(() => {
        if (!activeJob || activeJob.status === 'succeeded' || activeJob.status === 'failed') return;

        const interval = setInterval(async () => {
          try {
            const res = await fetch(`/api/v1/jobs/${activeJob.job_id}`);
            if (res.ok) {
              const data = await res.json();
              setActiveJob(data);
              if (data.status === 'succeeded' || data.status === 'failed') {
                setGenerating(false);
              }
            }
          } catch (e) {
            console.error('Failed to poll job status', e);
          }
        }, 2000);

        return () => clearInterval(interval);
      }, [activeJob]);

      const fetchKeys = async () => {
        try {
          const res = await fetch('/api/v1/config/keys');
          if (res.ok) {
            const data = await res.json();
            setKeys(data);
          }
        } catch (e) {
          console.error('Failed to fetch keys', e);
        }
      };

      const handleRequestCode = async (e) => {
        e.preventDefault();
        setAuthError('');
        setAuthLoading(true);
        try {
          const res = await fetch('/api/v1/auth/request-code', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email || 'developer@antigravity.google' }),
          });
          const data = await res.json();
          if (res.ok) {
            setSentCode(data.code);
            setLoginLink(data.login_link);
            setInputCode(data.code); // prefill for easy one-click testing
            setAuthStep('verify');
          } else {
            setAuthError(data.detail || 'Failed to request login code');
          }
        } catch (err) {
          setAuthError('Connection error requesting login code');
        } finally {
          setAuthLoading(false);
        }
      };

      const handleVerifyCode = async (e) => {
        e.preventDefault();
        setAuthError('');
        setAuthLoading(true);
        try {
          const res = await fetch('/api/v1/auth/verify-code', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code: inputCode, email }),
          });
          const data = await res.json();
          if (res.ok) {
            const authData = { email: data.user, token: data.token };
            localStorage.setItem('incubrix_auth', JSON.stringify(authData));
            setAuth(authData);
          } else {
            setAuthError(data.detail || 'Invalid or expired authorization code');
          }
        } catch (err) {
          setAuthError('Connection error verifying code');
        } finally {
          setAuthLoading(false);
        }
      };

      const handleLogout = () => {
        localStorage.removeItem('incubrix_auth');
        setAuth(null);
        setAuthStep('request');
      };

      const handleSaveKeys = async (e) => {
        e.preventDefault();
        setKeysLoading(true);
        setKeyMessage('');
        try {
          const res = await fetch('/api/v1/config/keys', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              pixabay_key: pixabayKeyInput || undefined,
              pexels_key: pexelsKeyInput || undefined,
            }),
          });
          const data = await res.json();
          if (res.ok) {
            setKeyMessage('API keys saved and active in .env!');
            setPixabayKeyInput('');
            setPexelsKeyInput('');
            fetchKeys();
          } else {
            setKeyMessage(data.detail || 'Failed to save keys');
          }
        } catch (err) {
          setKeyMessage('Error saving keys');
        } finally {
          setKeysLoading(false);
        }
      };

      const handleCreateVideo = async (e) => {
        e.preventDefault();
        if (!scriptText.trim()) return;
        setGenerating(true);
        setJobError('');
        setActiveJob(null);

        try {
          const avoidList = avoidTags.split(',').map(s => s.trim()).filter(Boolean);
          const res = await fetch('/api/v1/broll/jobs', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              script: scriptText,
              aspect_ratios: [aspectRatio],
              style: styleTheme,
              voice: voice,
              avoid: avoidList,
            }),
          });
          const data = await res.json();
          if (res.status === 202) {
            setActiveJob(data);
          } else {
            setJobError(data.message || 'Job submission rejected');
            setGenerating(false);
          }
        } catch (err) {
          setJobError('Network error starting render job');
          setGenerating(false);
        }
      };

      // 1. Antigravity Auth Screen
      if (!auth) {
        return (
          <div className="flex items-center justify-center min-h-screen px-4">
            <div className="w-full max-w-md bg-zinc-900 border border-zinc-800 rounded-xl p-8 shadow-2xl">
              <div className="flex items-center space-x-3 mb-6">
                <div className="w-10 h-10 rounded-lg bg-emerald-500/20 border border-emerald-500 flex items-center justify-center text-emerald-400 font-bold text-xl">
                  ▲
                </div>
                <div>
                  <h1 className="text-xl font-bold tracking-tight text-white">IncuBrix Studio</h1>
                  <p className="text-xs text-zinc-400">Antigravity AI Video Engine</p>
                </div>
              </div>

              {authStep === 'request' ? (
                <form onSubmit={handleRequestCode} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-zinc-300 uppercase tracking-wider mb-2">
                      Antigravity User Email
                    </label>
                    <input
                      type="email"
                      value={email}
                      onChange={(e) => setEmail(e.target.value)}
                      placeholder="developer@antigravity.google"
                      className="w-full px-4 py-2.5 bg-zinc-950 border border-zinc-800 rounded-lg text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-emerald-500 font-mono"
                    />
                  </div>

                  {authError && (
                    <div className="p-3 bg-red-950/50 border border-red-800 rounded-lg text-xs text-red-300">
                      {authError}
                    </div>
                  )}

                  <button
                    type="submit"
                    disabled={authLoading}
                    className="w-full py-2.5 px-4 bg-emerald-500 hover:bg-emerald-600 disabled:opacity-50 text-black font-semibold rounded-lg text-sm transition-colors flex items-center justify-center space-x-2"
                  >
                    <span>{authLoading ? 'Requesting Link...' : 'Send Antigravity Login Link'}</span>
                  </button>
                  <p className="text-xs text-zinc-500 text-center">
                    Uses Antigravity device authorization link & code
                  </p>
                </form>
              ) : (
                <form onSubmit={handleVerifyCode} className="space-y-4">
                  <div className="p-3 bg-zinc-950 border border-zinc-800 rounded-lg font-mono text-xs space-y-2">
                    <div className="text-emerald-400 font-semibold flex items-center space-x-2">
                      <span className="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                      <span>Login Link Generated</span>
                    </div>
                    <div className="text-zinc-400 truncate">
                      Link: <span className="text-zinc-200 underline">{loginLink}</span>
                    </div>
                    <div className="text-zinc-400">
                      Authorization Code: <span className="text-emerald-300 font-bold bg-zinc-900 px-2 py-0.5 rounded">{sentCode}</span>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-zinc-300 uppercase tracking-wider mb-2">
                      Enter Authorization Code
                    </label>
                    <input
                      type="text"
                      value={inputCode}
                      onChange={(e) => setInputCode(e.target.value)}
                      placeholder="AGY-XXXXXX"
                      className="w-full px-4 py-2.5 bg-zinc-950 border border-zinc-800 rounded-lg text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-emerald-500 font-mono tracking-widest uppercase text-center text-lg"
                    />
                  </div>

                  {authError && (
                    <div className="p-3 bg-red-950/50 border border-red-800 rounded-lg text-xs text-red-300">
                      {authError}
                    </div>
                  )}

                  <button
                    type="submit"
                    disabled={authLoading}
                    className="w-full py-2.5 px-4 bg-emerald-500 hover:bg-emerald-600 disabled:opacity-50 text-black font-semibold rounded-lg text-sm transition-colors"
                  >
                    {authLoading ? 'Verifying Code...' : 'Verify & Enter Studio'}
                  </button>

                  <button
                    type="button"
                    onClick={() => setAuthStep('request')}
                    className="w-full py-1 text-xs text-zinc-400 hover:text-zinc-200 transition-colors"
                  >
                    ← Back to request link
                  </button>
                </form>
              )}
            </div>
          </div>
        );
      }

      // 2. Main Studio Dashboard
      return (
        <div className="min-h-screen flex flex-col">
          {/* Top Bar */}
          <header className="border-b border-zinc-800 bg-zinc-900/60 backdrop-blur sticky top-0 z-50 px-6 py-3 flex items-center justify-between">
            <div className="flex items-center space-x-3">
              <div className="w-8 h-8 rounded-lg bg-emerald-500/20 border border-emerald-500 flex items-center justify-center text-emerald-400 font-bold">
                ▲
              </div>
              <span className="font-bold text-lg tracking-tight text-white">IncuBrix Studio</span>
              <span className="text-xs bg-zinc-800 text-zinc-400 px-2 py-0.5 rounded font-mono">v1.0.0</span>
            </div>

            <div className="flex items-center space-x-4">
              <div className="flex items-center space-x-2 text-xs">
                <span className={`w-2 h-2 rounded-full ${keys.pixabay_configured ? 'bg-emerald-400' : 'bg-amber-400'}`}></span>
                <span className="text-zinc-300">
                  {keys.pixabay_configured ? `Pixabay (${keys.pixabay_masked})` : 'Pixabay Unconfigured'}
                </span>
              </div>
              <div className="h-4 w-px bg-zinc-800"></div>
              <span className="text-xs font-mono text-zinc-400">{auth.email}</span>
              <button
                onClick={handleLogout}
                className="text-xs text-zinc-400 hover:text-red-400 transition-colors"
              >
                Logout
              </button>
            </div>
          </header>

          {/* Main Grid */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            {/* Left Column: API Keys & Settings (4 cols) */}
            <div className="lg:col-span-4 space-y-6">
              {/* API Keys Card */}
              <div className="bg-zinc-900 border border-zinc-800 rounded-xl p-5 shadow-sm space-y-4">
                <div className="flex items-center justify-between">
                  <h2 className="text-sm font-semibold uppercase tracking-wider text-zinc-300">API Credentials</h2>
                  <span className="text-xs text-emerald-400 bg-emerald-950/40 border border-emerald-800/40 px-2 py-0.5 rounded">
                    Safe Cache
                  </span>
                </div>

                <form onSubmit={handleSaveKeys} className="space-y-4">
                  <div>
                    <div className="flex items-center justify-between mb-1.5">
                      <label className="text-xs text-zinc-400 font-medium">Pixabay API Key</label>
                      {keys.pixabay_configured && (
                        <span className="text-[10px] text-emerald-400 font-mono">Active</span>
                      )}
                    </div>
                    <input
                      type="password"
                      value={pixabayKeyInput}
                      onChange={(e) => setPixabayKeyInput(e.target.value)}
                      placeholder={keys.pixabay_masked ? `Current: ${keys.pixabay_masked}` : 'Enter Pixabay API Key'}
                      className="w-full px-3 py-2 bg-zinc-950 border border-zinc-800 rounded-lg text-xs font-mono text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-emerald-500"
                    />
                  </div>

                  <div>
                    <div className="flex items-center justify-between mb-1.5">
                      <label className="text-xs text-zinc-400 font-medium">Pexels API Key (Optional)</label>
                      {keys.pexels_configured && (
                        <span className="text-[10px] text-emerald-400 font-mono">Active</span>
                      )}
                    </div>
                    <input
                      type="password"
                      value={pexelsKeyInput}
                      onChange={(e) => setPexelsKeyInput(e.target.value)}
                      placeholder={keys.pexels_masked ? `Current: ${keys.pexels_masked}` : 'Enter Pexels API Key'}
                      className="w-full px-3 py-2 bg-zinc-950 border border-zinc-800 rounded-lg text-xs font-mono text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-emerald-500"
                    />
                  </div>

                  {keyMessage && (
                    <div className="p-2.5 bg-zinc-950 border border-zinc-800 rounded text-xs text-emerald-300 font-mono">
                      {keyMessage}
                    </div>
                  )}

                  <button
                    type="submit"
                    disabled={keysLoading}
                    className="w-full py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-200 rounded-lg text-xs font-medium transition-colors"
                  >
                    {keysLoading ? 'Saving Keys...' : 'Save API Keys'}
                  </button>
                </form>
              </div>

              {/* Renders Directory Info */}
              <div className="bg-zinc-900 border border-zinc-800 rounded-xl p-5 shadow-sm space-y-3 font-mono text-xs">
                <h3 className="text-zinc-400 uppercase tracking-wider font-sans font-semibold text-[11px]">Central Storage</h3>
                <div className="p-2.5 bg-zinc-950 rounded border border-zinc-800 text-zinc-300 break-all">
                  📁 ./renders/{'{job_id}'}/
                </div>
                <p className="text-[11px] text-zinc-500 font-sans">
                  Each video generation request creates an isolated directory storing its Remotion harness, narration audio, clips, and exported MP4s.
                </p>
              </div>
            </div>

            {/* Right Column: Video Studio Generator & Player (8 cols) */}
            <div className="lg:col-span-8 space-y-6">
              {/* Studio Generator Card */}
              <div className="bg-zinc-900 border border-zinc-800 rounded-xl p-6 shadow-sm space-y-5">
                <div className="flex items-center justify-between">
                  <h2 className="text-base font-bold text-white tracking-tight">Script-to-Video Studio</h2>
                  <span className="text-xs text-zinc-400 font-mono">Remotion 1080p Engine</span>
                </div>

                <form onSubmit={handleCreateVideo} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-zinc-300 uppercase tracking-wider mb-2">
                      Narration Script
                    </label>
                    <textarea
                      rows="3"
                      value={scriptText}
                      onChange={(e) => setScriptText(e.target.value)}
                      placeholder="Type your narration script here. Scenes will be segmented automatically with matched B-roll..."
                      className="w-full p-3 bg-zinc-950 border border-zinc-800 rounded-lg text-sm text-zinc-200 placeholder-zinc-600 focus:outline-none focus:border-emerald-500 font-sans"
                    ></textarea>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    {/* Aspect Ratio */}
                    <div>
                      <label className="block text-xs text-zinc-400 mb-1.5 font-medium">Aspect Ratio</label>
                      <select
                        value={aspectRatio}
                        onChange={(e) => setAspectRatio(e.target.value)}
                        className="w-full p-2.5 bg-zinc-950 border border-zinc-800 rounded-lg text-xs text-zinc-200 focus:outline-none focus:border-emerald-500"
                      >
                        <option value="16:9">16:9 (Landscape 1080p)</option>
                        <option value="9:16">9:16 (Shorts / Reels)</option>
                        <option value="1:1">1:1 (Square Feed)</option>
                      </select>
                    </div>

                    {/* Theme Style */}
                    <div>
                      <label className="block text-xs text-zinc-400 mb-1.5 font-medium">Style Theme</label>
                      <select
                        value={styleTheme}
                        onChange={(e) => setStyleTheme(e.target.value)}
                        className="w-full p-2.5 bg-zinc-950 border border-zinc-800 rounded-lg text-xs text-zinc-200 focus:outline-none focus:border-emerald-500"
                      >
                        <option value="developer">Developer Plate (Dark / Code)</option>
                        <option value="ink">Ink (Editorial)</option>
                        <option value="paper">Paper (Warm Academic)</option>
                        <option value="signal">Signal (High Contrast Amber)</option>
                      </select>
                    </div>

                    {/* Voice Model */}
                    <div>
                      <label className="block text-xs text-zinc-400 mb-1.5 font-medium">Voiceover</label>
                      <select
                        value={voice}
                        onChange={(e) => setVoice(e.target.value)}
                        className="w-full p-2.5 bg-zinc-950 border border-zinc-800 rounded-lg text-xs text-zinc-200 focus:outline-none focus:border-emerald-500"
                      >
                        <option value="en-IN-female">Neerja (en-IN Female)</option>
                        <option value="en-IN-male">Prabhat (en-IN Male)</option>
                        <option value="en-US-female">Jenny (en-US Female)</option>
                        <option value="en-US-male">Guy (en-US Male)</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs text-zinc-400 mb-1.5 font-medium">
                      Negative Avoid Constraints (Comma-separated)
                    </label>
                    <input
                      type="text"
                      value={avoidTags}
                      onChange={(e) => setAvoidTags(e.target.value)}
                      placeholder="watermark, blurry, low quality"
                      className="w-full px-3 py-2 bg-zinc-950 border border-zinc-800 rounded-lg text-xs text-zinc-300 placeholder-zinc-600 focus:outline-none focus:border-emerald-500 font-mono"
                    />
                  </div>

                  {jobError && (
                    <div className="p-3 bg-red-950/40 border border-red-800 rounded-lg text-xs text-red-300">
                      {jobError}
                    </div>
                  )}

                  <button
                    type="submit"
                    disabled={generating}
                    className="w-full py-3 bg-emerald-500 hover:bg-emerald-600 disabled:opacity-50 text-black font-bold rounded-lg text-sm transition-colors flex items-center justify-center space-x-2"
                  >
                    {generating ? (
                      <>
                        <span className="w-4 h-4 border-2 border-black border-t-transparent rounded-full animate-spin"></span>
                        <span>Rendering Video in Harness...</span>
                      </>
                    ) : (
                      <span>Generate 1080p B-Roll Video</span>
                    )}
                  </button>
                </form>
              </div>

              {/* Progress & Video Output Card */}
              {activeJob && (
                <div className="bg-zinc-900 border border-zinc-800 rounded-xl p-6 shadow-sm space-y-4">
                  <div className="flex items-center justify-between">
                    <div>
                      <h3 className="text-sm font-bold text-white">Job: {activeJob.job_id}</h3>
                      <p className="text-xs text-zinc-400 font-mono mt-0.5">
                        Stage: <span className="text-emerald-400 uppercase font-semibold">{activeJob.stage}</span>
                      </p>
                    </div>
                    <span className={`text-xs px-2.5 py-1 rounded-full font-mono font-semibold ${
                      activeJob.status === 'succeeded' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' :
                      activeJob.status === 'failed' ? 'bg-red-950 text-red-400 border border-red-800' :
                      'bg-blue-950 text-blue-400 border border-blue-800 animate-pulse'
                    }`}>
                      {activeJob.status.toUpperCase()} ({activeJob.progress}%)
                    </span>
                  </div>

                  {/* Progress Bar */}
                  <div className="w-full bg-zinc-950 rounded-full h-2.5 border border-zinc-800 overflow-hidden">
                    <div
                      className="bg-emerald-500 h-2.5 rounded-full transition-all duration-500 ease-out"
                      style={{ width: `${activeJob.progress}%` }}
                    ></div>
                  </div>

                  {/* Video Player when succeeded */}
                  {activeJob.status === 'succeeded' && (
                    <div className="space-y-4 pt-2">
                      <div className="rounded-xl overflow-hidden border border-zinc-800 bg-black aspect-video flex items-center justify-center">
                        <video
                          controls
                          autoPlay
                          playsInline
                          className="w-full h-full object-contain"
                          src={`/api/v1/jobs/${activeJob.job_id}/artifacts/video_${aspectRatio.replace(':', '_')}.mp4`}
                        >
                          Your browser does not support the video tag.
                        </video>
                      </div>

                      <div className="flex flex-wrap items-center justify-between gap-3 pt-2">
                        <div className="flex items-center space-x-2">
                          <a
                            href={`/api/v1/jobs/${activeJob.job_id}/artifacts/video_${aspectRatio.replace(':', '_')}.mp4`}
                            download
                            className="px-4 py-2 bg-emerald-500 hover:bg-emerald-600 text-black font-semibold rounded-lg text-xs transition-colors"
                          >
                            Download 1080p MP4
                          </a>
                          <a
                            href={`/api/v1/jobs/${activeJob.job_id}/artifacts/timeline.json`}
                            target="_blank"
                            className="px-3 py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded-lg text-xs transition-colors font-mono"
                          >
                            timeline.json
                          </a>
                          <a
                            href={`/api/v1/jobs/${activeJob.job_id}/artifacts/manifest.json`}
                            target="_blank"
                            className="px-3 py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded-lg text-xs transition-colors font-mono"
                          >
                            manifest.json
                          </a>
                        </div>

                        <span className="text-xs text-zinc-400 font-mono">
                          Saved in: ./renders/{activeJob.job_id}/
                        </span>
                      </div>
                    </div>
                  )}

                  {/* Failure detail */}
                  {activeJob.status === 'failed' && (
                    <div className="p-4 bg-red-950/40 border border-red-800 rounded-lg text-xs text-red-300 font-mono">
                      Error: {activeJob.error ? JSON.stringify(activeJob.error) : 'Video rendering failed.'}
                    </div>
                  )}
                </div>
              )}
            </div>

          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
